<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#39AFFF" stop-opacity="0.27"/>
      <stop offset="0.46" stop-color="#78C9FF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#CDEBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DCEEFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#77BFF2" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70D0FF"/>
      <stop offset="1" stop-color="#2F86F6"/>
    </linearGradient>
    <filter id="glassShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3F7097" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#canvas)"/>
  <ellipse cx="300" cy="406" rx="300" ry="142" fill="url(#ambient)"/>

  <text x="300" y="49"
        fill="#171A20"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="600"
        letter-spacing="-0.35"
        text-anchor="middle">KeyLight</text>
  <text x="300" y="77"
        fill="#646B74"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="14"
        font-weight="400"
        text-anchor="middle">Quit KeyLight, then drag it to Applications</text>

  <rect x="70" y="117" width="460" height="194" rx="44"
        fill="url(#glass)"
        stroke="url(#glassEdge)"
        stroke-width="1.5"
        filter="url(#glassShadow)"/>
  <path d="M109 132 H491"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.82"
        stroke-width="1"
        stroke-linecap="round"/>
  <path d="M104 295 C179 311 421 311 496 295"
        fill="none"
        stroke="#68B9EF"
        stroke-opacity="0.20"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <path d="M252 205 H344 M334 195 L344 205 L334 215"
        fill="none"
        stroke="url(#arrow)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Keep the footer inside Finder's 32 px title-bar safe area. -->
  <text x="300" y="348"
        fill="#68717C"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="10.5"
        font-weight="400"
        letter-spacing="0.03"
        text-anchor="middle">Choose Replace when asked  •  macOS 14+  •  System Glass on macOS 26+</text>
</svg>
